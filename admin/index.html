<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="Modeleur Palo">Palo — Modeleur</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Login (same-origin) -->
    <section id="login-view" class="login-view">
      <form id="login-form" class="login-card" autocomplete="on">
        <div class="login-lang">
          <label>
            <span data-i18n="Langue">Langue</span>
            <select id="login-lang" class="lang-select" aria-label="Language">
              <option value="fr">Français</option>
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </label>
        </div>
        <h1 data-i18n="Modeleur Palo">Modeleur Palo</h1>
        <p class="muted" id="login-origin-label" data-i18n="Serveur : …">Serveur&nbsp;: …</p>
        <label>
          <span data-i18n="Identifiant">Identifiant</span>
          <input id="inp-user" type="text" value="admin" autocomplete="username" required />
        </label>
        <label>
          <span data-i18n="Mot de passe">Mot de passe</span>
          <input id="inp-pass" type="password" value="admin" autocomplete="current-password" required />
        </label>
        <button type="submit" id="btn-login" class="btn btn-primary" data-i18n="Connexion">Connexion</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </section>

    <div id="app" class="app hidden">
      <header class="topbar">
        <strong data-i18n="Modeleur Palo">Modeleur Palo</strong>
        <span id="session-label" class="muted"></span>
        <div id="toast" class="toast hidden" role="status"></div>
        <select id="app-lang" class="lang-select lang-select--topbar" aria-label="Language" title="Language">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="de">DE</option>
        </select>
        <a
          id="btn-api-docs"
          class="btn btn-icon btn-ghost topbar-api"
          href="/api"
          data-i18n-title="Documentation API"
          title="Documentation API"
          aria-label="Documentation API"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M1.75 2.5A.75.75 0 0 1 2.5 1.75h4.25c.83 0 1.58.34 2.12.88A2.99 2.99 0 0 1 11 1.75h2.5a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75H11a1.5 1.5 0 0 0-1.5 1.5.75.75 0 0 1-1.5 0 1.5 1.5 0 0 0-1.5-1.5H2.5a.75.75 0 0 1-.75-.75V2.5zm1.5.75v9h3.25c.54 0 1.05.14 1.5.4V4.06A1.5 1.5 0 0 0 6.75 3.25H3.25zm9.5 0H11a1.5 1.5 0 0 0-1.5.81v8.59c.45-.26.96-.4 1.5-.4h1.75v-9z"
            />
          </svg>
        </a>
        <button type="button" id="btn-logout" class="btn btn-ghost" data-i18n="Déconnexion">Déconnexion</button>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-toolbar">
            <button
              type="button"
              id="btn-refresh-tree"
              class="btn btn-icon btn-small"
              data-i18n-title="Rafraîchir"
              title="Rafraîchir"
              aria-label="Rafraîchir"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 2.5a5.5 5.5 0 0 0-4.66 2.56.75.75 0 1 1-1.27-.8A7 7 0 0 1 14.5 8h1.1a.75.75 0 0 1 .53 1.28l-2 2a.75.75 0 0 1-1.06 0l-2-2A.75.75 0 0 1 11.6 8H13A5.5 5.5 0 0 0 8 2.5zm5.93 6.64a.75.75 0 0 1 .8 1.27A7 7 0 0 1 1.5 8H.4a.75.75 0 0 1-.53-1.28l2-2a.75.75 0 0 1 1.06 0l2 2A.75.75 0 0 1 4.4 8H3a5.5 5.5 0 0 0 10.93 1.14z"/></svg>
            </button>
            <button
              type="button"
              id="btn-new-database"
              class="btn btn-icon btn-small btn-primary"
              data-i18n-title="Nouvelle base"
              title="Nouvelle base"
              aria-label="Nouvelle base"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
            </button>
          </div>
          <ul id="tree" class="tree" role="tree"></ul>
        </aside>

        <main class="detail">
          <div id="detail-empty" class="detail-empty muted" data-i18n="Sélectionnez une base, une dimension ou un cube dans l’arbre.">
            Sélectionnez une base, une dimension ou un cube dans l’arbre.
          </div>
          <div id="detail-panel" class="detail-panel hidden"></div>
        </main>
      </div>
    </div>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <header class="modal-header">
          <h2 id="modal-title">…</h2>
          <button type="button" class="btn btn-ghost" data-close="1" data-i18n-title="Fermer" title="Fermer" aria-label="Fermer">×</button>
        </header>
        <div id="modal-body" class="modal-body"></div>
        <footer class="modal-footer">
          <button type="button" class="btn" data-close="1" data-i18n="Annuler">Annuler</button>
          <button type="button" id="modal-ok" class="btn btn-primary">OK</button>
        </footer>
      </div>
    </div>

    <div id="reauth-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reauth-title">
        <header class="modal-header">
          <h2 id="reauth-title" data-i18n="Session expirée">Session expirée</h2>
        </header>
        <form id="reauth-form" class="modal-body">
          <p class="muted" data-i18n="La connexion au serveur Palo a expiré (inactivité). Reconnectez-vous pour continuer.">
            La connexion au serveur Palo a expiré (inactivité). Reconnectez-vous pour continuer.
          </p>
          <label>
            <span data-i18n="Identifiant">Identifiant</span>
            <input id="reauth-user" type="text" autocomplete="username" required />
          </label>
          <label>
            <span data-i18n="Mot de passe">Mot de passe</span>
            <input id="reauth-pass" type="password" autocomplete="current-password" required />
          </label>
          <p id="reauth-error" class="error hidden"></p>
          <div class="modal-footer" style="padding: 0; border: 0; justify-content: flex-end">
            <button type="submit" id="reauth-ok" class="btn btn-primary" data-i18n="Se reconnecter">Se reconnecter</button>
          </div>
        </form>
      </div>
    </div>

    <script src="vendor/md5.js"></script>
    <script src="js/palo-csv.js"></script>
    <script src="js/api.js"></script>
    <!-- deploy-local préfixe i18n.js + rule-editor.js dans app.js -->
    <script src="js/app.js?v=i18n-1"></script>
  </body>
</html>
